<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liver cell viewer</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --rule: #e1e0d9; --field: #ffffff; --accent: #2a78d6;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --rule: #383835; --field: #232322; --accent: #3987e5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; grid-template-columns: 320px 1fr; background: var(--page); color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  aside {
    display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; overflow-y: auto;
    border-right: 1px solid var(--rule); background: var(--page);
  }
  aside > * { flex: none; } /* the sidebar scrolls rather than squeezing the slide list */
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .sub { color: var(--ink2); font-size: 12px; margin-top: 2px; }
  label.field { display: flex; flex-direction: column; gap: 4px; color: var(--ink2); font-size: 12px; }
  label.field[hidden] { display: none; }
  select, button {
    font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 4px;
  }
  select { padding: 4px 6px; }
  #slides { height: 260px; font-variant-numeric: tabular-nums; }
  #slides optgroup { color: var(--ink2); font-style: normal; }
  #slides option { color: var(--ink); }
  .pathology {
    display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; font-size: 12px;
    border: 1px solid var(--rule); border-radius: 4px; background: var(--surface);
  }
  .pathology[hidden] { display: none; }
  .pathology .head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .pathology .flag { color: var(--muted); font-weight: 400; }
  .pathology .categories { color: var(--ink2); }
  .pathology .notes { margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink2); font-size: 12px; }
  .check { display: flex; align-items: center; gap: 6px; color: var(--ink2); font-size: 12px; }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  fieldset legend { padding: 0; margin-bottom: 4px; color: var(--ink2); font-size: 12px; }
  fieldset label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  #legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  #legend li { display: flex; align-items: center; gap: 6px; }
  #legend label { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; cursor: pointer; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--rule); }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  button.only { padding: 0 6px; font-size: 11px; color: var(--ink2); cursor: pointer; }
  button.only:hover, #theme:hover { border-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .clusters { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--rule); }
  .clusters .head { color: var(--ink2); font-size: 12px; }
  .clusters .controls { display: flex; align-items: center; gap: 10px; }
  .clusters .controls label { display: flex; align-items: center; gap: 5px; color: var(--ink2); font-size: 12px; }
  #radius { width: 64px; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 4px; }
  #k { width: 52px; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 4px; }
  #run { padding: 2px 12px; cursor: pointer; margin-left: auto; }
  .neighbourhood { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--ink2); font-size: 12px; }
  .neighbourhood[hidden] { display: none; }
  .neighbourhood label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .neighbourhood select { padding: 2px 4px; }
  #nb-k { width: 52px; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 4px; }
  #run:hover { border-color: var(--accent); }
  #run:disabled { cursor: progress; color: var(--muted); }
  .note { margin: 0; color: var(--muted); font-size: 11px; }
  .mix { display: flex; width: 48px; height: 8px; flex: none; border-radius: 2px; overflow: hidden; gap: 1px; background: var(--rule); }
  .mix span { display: block; height: 100%; }
  #theme { padding: 3px 10px; cursor: pointer; align-self: flex-start; }
  #status { color: var(--ink2); font-size: 12px; margin: 0; min-height: 34px; }
  #stage { position: relative; min-width: 0; height: 100vh; }
  #viewer { position: absolute; inset: 0; background: var(--surface); }
  #scalebar {
    position: absolute; left: 16px; bottom: 16px; z-index: 5; pointer-events: none;
    padding: 3px 8px 6px; border-radius: 4px; box-shadow: 0 0 0 1px var(--rule);
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    color: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  #scalebar[hidden] { display: none; }
  #scalebar .bar { height: 5px; margin-top: 2px; border: 2px solid var(--ink); border-top: 0; }
  #curves {
    position: absolute; right: 16px; bottom: 16px; z-index: 6; padding: 8px 10px 6px; border-radius: 6px;
    background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: 0 0 0 1px var(--rule);
    color: var(--ink); font-size: 12px;
  }
  #curves[hidden], #curves-open[hidden] { display: none; }
  .curves-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .curves-head select { flex: 1; padding: 2px 4px; }
  #curves-close { padding: 0 8px; cursor: pointer; }
  #curves-chart svg { display: block; }
  #curves-chart svg text { fill: var(--ink2); font-size: 10px; font-variant-numeric: tabular-nums; }
  .curves-legend { display: flex; gap: 12px; color: var(--ink2); font-size: 11px; padding-left: 36px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .curves-tip {
    position: absolute; pointer-events: none; padding: 4px 7px; border-radius: 4px; font-size: 11px;
    background: var(--surface); box-shadow: 0 0 0 1px var(--rule); font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .curves-tip[hidden] { display: none; }
  .curves-tip .tip-head { color: var(--ink2); margin-bottom: 2px; }
  #curves-open {
    position: absolute; right: 16px; bottom: 16px; z-index: 6; padding: 3px 10px; cursor: pointer;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.0.0/openseadragon.min.js"></script>
</head>
<body>
<aside>
  <div>
    <h1>Liver cell viewer</h1>
    <div class="sub">GTEx liver cohort, HistoPLUS cells</div>
  </div>
  <label class="field">Pathology group <select id="group"></select></label>
  <label class="check"><input type="checkbox" id="hne-only"> <span id="hne-only-label">Only slides with H&amp;E</span></label>
  <div class="row"><span>Slide</span><span id="n-slides"></span></div>
  <select id="slides" size="14" aria-label="Slide"></select>
  <div id="pathology" class="pathology" hidden>
    <div class="head"><span id="pathology-group"></span><span id="pathology-flag" class="flag"></span></div>
    <div id="pathology-donor" class="categories"
      title="Hardy scale: GTEx's circumstances of death, from ventilator case (0) and violent, fast death (1) through fast natural (2) and intermediate (3) to slow death (4)"></div>
    <div id="pathology-categories" class="categories"></div>
    <p id="pathology-notes" class="notes"></p>
  </div>
  <fieldset>
    <legend>Colour by</legend>
    <label><input type="radio" name="layer" value="types" checked> HistoPLUS type</label>
    <label><input type="radio" name="layer" value="classes"> Class</label>
    <label><input type="radio" name="layer" value="clusters" id="layer-clusters" disabled> Clusters</label>
    <label><input type="radio" name="layer" value="density"> 10-NN density</label>
    <label><input type="radio" name="layer" value="voronoi" id="layer-voronoi"> Voronoi density</label>
    <label><input type="radio" name="layer" value="homotypic" id="layer-homotypic"> Homotypic fraction</label>
    <label><input type="radio" name="layer" value="entropy" id="layer-entropy"> Local entropy</label>
  </fieldset>
  <div class="neighbourhood" id="neighbourhood" hidden>
    <label>k <input type="number" id="nb-k" min="2" max="100" step="1" value="15"> nearest</label>
    <label>by <select id="nb-by"><option value="types">HistoPLUS type</option><option value="classes">class</option></select></label>
  </div>
  <ul id="legend"></ul>
  <p class="note" id="legend-note" hidden></p>
  <label class="field">Show only cells with 10-NN density at or above
    <input type="range" id="threshold" min="0" max="999" step="1" value="0" list="density-slices">
  </label>
  <datalist id="density-slices">
    <option value="0"></option><option value="100"></option><option value="200"></option><option value="300"></option>
    <option value="400"></option><option value="500"></option><option value="600"></option><option value="700"></option>
    <option value="800"></option><option value="900"></option>
  </datalist>
  <p class="note" id="threshold-note"></p>
  <section class="clusters">
    <div class="head">Clusters on this slide</div>
    <label class="field">Features <select id="method">
      <option value="composition">Composition of every cell's ball</option>
      <option value="tda">Chromatic TDA of the pilot's centres</option>
      <option value="emeans">Cohort e-means clusters (saved)</option>
    </select></label>
    <label class="field" id="emeans-field" hidden>e-means features <select id="emeans-set"></select></label>
    <div class="controls">
      <label>k <input type="number" id="k" min="2" max="10" step="1" value="4"></label>
      <label>radius <input type="number" id="radius" min="10" max="500" step="10" value="150"> µm</label>
    </div>
    <div class="controls">
      <label class="check"><input type="checkbox" id="density" checked> with density</label>
      <button type="button" id="run">Run</button>
    </div>
    <p class="note" id="cluster-note"></p>
  </section>
  <label class="field">Point size <input type="range" id="size" min="0.25" max="4" step="0.25" value="1"></label>
  <label class="field">Opacity <input type="range" id="alpha" min="0.1" max="1" step="0.05" value="0.85"></label>
  <label class="check"><input type="checkbox" id="hne" checked disabled> Show the H&amp;E</label>
  <button type="button" id="theme">Light / dark</button>
  <p id="status">Starting …</p>
</aside>
<main id="stage">
  <div id="viewer"></div>
  <div id="scalebar" hidden><div class="label"></div><div class="bar"></div></div>
  <section id="curves" aria-label="Class curves over the density threshold" hidden>
    <div class="curves-head">
      <select id="curves-view" aria-label="Curve"></select>
      <button type="button" id="curves-close" title="Hide the class curves">×</button>
    </div>
    <div id="curves-chart"></div>
    <div id="curves-legend" class="curves-legend"></div>
    <div id="curves-tip" class="curves-tip" hidden></div>
  </section>
  <button type="button" id="curves-open" hidden>Class curves</button>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
